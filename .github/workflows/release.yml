name: release

# Publishes a Boundary Unlimited release.
#
# Trigger: a commit lands on main that changes version/VERSION (the release PR
# opened by the release manager routine and merged by a human), or a manual run.
# The workflow refuses to publish unless:
#   - version/VERSION holds a plain MAJOR.MINOR.PATCH version,
#   - CHANGELOG.md has a "## <version> (<date>)" section for it, and
#   - no GitHub release or tag for v<version> exists yet.
#
# It builds binaries for the supported platforms from the exact commit, writes a
# SHA256SUMS file and creates the GitHub release (and its tag) with the notes
# taken from the CHANGELOG. Only the final job has write access.
# See docs/release-process.md.

on:
  push:
    branches: [main]
    paths:
      - version/VERSION
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package everything but do not create the release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: determine version and notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.exists.outputs.publish }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read and validate the version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version/VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version/VERSION must be MAJOR.MINOR.PATCH, got: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check that the release does not exist yet
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release or tag $TAG already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract release notes from CHANGELOG.md
        if: steps.exists.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Everything between "## <version> (...)" and the next "## " heading.
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no (or an empty) '## $VERSION' section; refusing to release." >&2
            exit 1
          fi
          cat release-notes.md
      - name: Upload release notes
        if: steps.exists.outputs.publish == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          suffix=""; [ "$GOOS" = "windows" ] && suffix=".exe"
          export BASE_PRODUCT_VERSION="$VERSION"
          export BIN_PATH="bin/boundary${suffix}"
          # scripts/build.sh builds the embedded plugins for the target platform first, then boundary,
          # and copies LICENSE next to the binary as bin/LICENSE.txt.
          export GOOS GOARCH CGO_ENABLED
          bash scripts/build.sh
          mkdir -p dist/out
          name="boundary-unlimited_${VERSION}_${GOOS}_${GOARCH}"
          (cd bin && zip -q -9 "../dist/out/${name}.zip" "boundary${suffix}" LICENSE.txt)
          ls -l dist/out
      - name: Upload build
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/out/*.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: artifacts
      - name: Collect files and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/build-*/*.zip release/
          cp artifacts/release-notes/release-notes.md release/
          (cd release && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS)
      - name: Create the GitHub release
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release/*.zip release/SHA256SUMS \
            --repo "$REPO" \
            --target "$SHA" \
            --title "Boundary Unlimited $TAG" \
            --notes-file release/release-notes.md
      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "Dry run only. Built and packaged $TAG but did not create a release."
