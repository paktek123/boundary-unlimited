name: "Pull Request Labeler"
on:
  # Disabled in the Boundary Unlimited fork: this workflow needs HashiCorp or cloud
  # infrastructure (secrets, private actions or runners) or is too heavy for hosted
  # runners. It can still be started by hand. Upstream triggers are kept in git history.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    runs-on: ${{ fromJSON(vars.RUNNER) }}
    steps:
    - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # v6.0.1
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
